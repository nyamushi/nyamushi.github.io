<script src="../assets/js/projects.js"></script>
<script src="../assets/js/main.js"></script>
<script>
/* ==========================================================================
   详情页渲染 —— 从 PROJECTS 数据层读取当前项目并生成页面结构
   ========================================================================== */
(function () {
  'use strict';

  var slug = (location.pathname.split('/').pop() || '').replace(/\.html?$/i, '');
  if (typeof PROJECTS === 'undefined') return;
  var p = PROJECTS.filter(function (x) { return x.slug === slug; })[0];
  if (!p) return;

  var q  = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s); };

  /* ---------- 页面标题与 SEO ---------- */
  document.title = p.title + ' · 毛安 工业设计作品集';
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', p.title + ' —— ' + String(p.subtitle || '').replace(/<[^>]+>/g, ''));

  /* ---------- Hero ---------- */
  q('.crumbs__here').textContent = p.title;
  q('.pd-index').textContent = p.index;
  q('.pd-title').textContent = p.title;
  q('.pd-sub').innerHTML = esc(p.subtitle);
  q('.pd-title-en').textContent = p.titleEn;

  var metaCells = [
    ['分类', p.category],
    ['时间', p.year],
    ['我的角色', p.role]
  ];
  if (p.award) metaCells.push(['项目性质', p.award]);
  if (p.team)  metaCells.push(['团队', p.team]);
  q('.pd-meta').innerHTML = metaCells.map(function (c) {
    return '<div class="pd-meta__cell"><p class="pd-meta__k">' + c[0] + '</p><p class="pd-meta__v">' + esc(c[1]) + '</p></div>';
  }).join('');

  /* ---------- 图片段落 ---------- */
  /* 详情页位于 projects/ 子目录，而数据层路径是相对站点根目录的，
     因此统一加 ../ 前缀后再写入 HTML。 */
  function rel(src) { return '../' + String(src).replace(/^\.\//, ''); }

  function figure(f, delay) {
    if (!f) return '';
    var full = rel(f.src);
    var srcset = f.width
      ? ' srcset="' + rel(f.src.replace(/-\d+(\.jpg)$/, '-700$1')) + ' 700w, ' +
                      rel(f.src.replace(/-\d+(\.jpg)$/, '-1100$1')) + ' 1100w, ' +
                      full + ' ' + f.width + 'w"' +
        ' sizes="(max-width: 900px) 100vw, min(1280px, 92vw)"'
      : '';
    var dims = f.width ? ' width="' + f.width + '" height="' + f.height + '"' : '';
    return '<section class="section section--tight"><div class="wrap">' +
      '<figure class="pd-figure" data-reveal style="--d:' + (delay || 0) + 'ms">' +
        '<img class="zoomable" src="' + full + '"' + srcset + dims +
          ' alt="' + esc(f.alt || p.title) + '"' +
          ' data-full="' + full + '" data-caption="' + esc(f.cap || '') + '"' +
          ' loading="lazy" decoding="async">' +
        '<figcaption>' + esc(f.cap || '') + '</figcaption>' +
      '</figure></div></section>';
  }

  /* ---------- 构建主体段落 ---------- */
  var out = [];

  /* 1. 项目概述 + 工作流程 */
  var overviewHTML = p.overview
    ? p.overview.map(function (t) { return '<p>' + t + '</p>'; }).join('')
    : '';
  var workflowHTML = p.workflow
    ? p.workflow.map(function (t, i) {
        return '<li data-i="' + String(i + 1).padStart(2, '0') + '"><span>' + t + '</span></li>';
      }).join('')
    : '';

  if (overviewHTML || workflowHTML) {
    out.push('<section class="section"><div class="wrap"><div class="pd-cols">' +
      '<div data-reveal><h2 class="pd-h3">项目概述</h2>' +
        (overviewHTML
          ? '<div class="pd-prose">' + overviewHTML + '</div>'
          : '<div class="pd-prose"><p>' + esc(p.subtitle) + '</p></div>') +
      '</div>' +
      (workflowHTML
        ? '<div data-reveal style="--d:100ms"><h2 class="pd-h3">我的工作流程</h2>' +
            '<ul class="bullets">' + workflowHTML + '</ul></div>'
        : '') +
    '</div></div></section>');
  }

  /* 2. 需求 / 设计目标 */
  if (p.requirements) {
    out.push('<section class="section section--tight"><div class="wrap">' +
      '<h2 class="pd-h3" data-reveal>需求与设计目标</h2>' +
      '<ul class="bullets" data-reveal style="--d:80ms">' +
        p.requirements.map(function (r) {
          return '<li data-i="' + r.i + '"><span>' + r.t + '</span></li>';
        }).join('') +
      '</ul></div></section>');
  }

  /* 3. 第一张图（如果有） */
  if (p.figures && p.figures.length) out.push(figure(p.figures[0], 0));

  /* 4. 设计亮点 */
  if (p.bullets) {
    out.push('<section class="section section--tight"><div class="wrap">' +
      '<h2 class="pd-h3" data-reveal>设计要点</h2>' +
      '<ul class="bullets" data-reveal style="--d:80ms">' +
        p.bullets.map(function (b) {
          return '<li data-i="' + b.i + '"><span>' + b.t + '</span></li>';
        }).join('') +
      '</ul></div></section>');
  }

  /* 5. 三件套系列（文创项目） */
  if (p.series) {
    out.push('<section class="section section--tight"><div class="wrap">' +
      '<h2 class="pd-h3" data-reveal>系列构成</h2>' +
      '<div class="cards">' +
      p.series.map(function (s, i) {
        return '<article class="card card--wide" data-reveal style="--d:' + (i * 90) + 'ms">' +
          '<div class="card__media" style="aspect-ratio:16/9">' +
            '<img class="zoomable" src="' + rel(s.imageLarge) + '"' +
              ' srcset="' + rel(s.imageLarge) + ' 1100w, ' + rel(s.image) + ' 1600w"' +
              ' sizes="(max-width: 900px) 100vw, min(1280px, 92vw)"' +
              ' alt="' + esc(s.alt) + '"' +
              ' data-full="' + rel(s.image) + '" data-caption="' + esc(s.name + ' · ' + s.slogan) + '"' +
              ' loading="lazy" decoding="async">' +
          '</div>' +
          '<div class="card__body">' +
            '<div class="card__top"><h3 class="card__title">' + s.name + '</h3>' +
              '<span class="card__year">' + s.proto + '</span></div>' +
            '<p class="card__sub" style="color:var(--accent);font-family:var(--mono);font-size:12px;letter-spacing:.06em">' + s.slogan + '</p>' +
            '<p class="card__sub">' + s.desc + '</p>' +
            '<table class="spec-table" style="margin-top:6px"><tbody>' +
              s.points.map(function (pt) {
                return '<tr><th>' + pt.k + '</th><td>' + pt.v + '</td></tr>';
              }).join('') +
            '</tbody></table>' +
          '</div></article>';
      }).join('') +
      '</div></div></section>');
  }

  /* 6. 其他课程项目清单 */
  if (p.items) {
    out.push('<section class="section section--tight"><div class="wrap">' +
      '<h2 class="pd-h3" data-reveal>项目清单</h2>' +
      '<div class="cards">' +
      p.items.map(function (it, i) {
        var inner = '<div class="card__body">' +
            '<div class="card__top"><h3 class="card__title">' + it.title + '</h3>' +
              '<span class="card__year">' + it.tag + '</span></div>' +
            '<p class="card__sub">' + it.desc + '</p>' +
            '<p class="card__sub" style="font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.06em">' + it.en + '</p>' +
          '</div>';
        return it.link
          ? '<a class="card card--mini" href="' + it.link + '.html" data-reveal style="--d:' + (i * 70) + 'ms">' + inner + '</a>'
          : '<article class="card card--mini" data-reveal style="--d:' + (i * 70) + 'ms">' + inner + '</article>';
      }).join('') +
      '</div></div></section>');
  }

  /* 7. CMF */
  if (p.cmf) {
    out.push('<section class="section section--tight"><div class="wrap">' +
      '<h2 class="pd-h3" data-reveal>CMF 设计</h2>' +
      '<div class="pd-cols">' +
        '<div data-reveal><div class="pd-prose"><p>' + p.cmf.desc + '</p></div></div>' +
        '<div data-reveal style="--d:100ms">' +
          '<div class="cmf-swatches">' +
            p.cmf.swatches.map(function (s) {
              return '<div class="swatch"><div class="swatch__chip" style="background:' + s.hex + '"></div>' +
                '<div><div class="swatch__name">' + s.name + '</div>' +
                '<div class="swatch__hex">' + s.hex + '</div></div></div>';
            }).join('') +
          '</div>' +
          (p.cmf.materials ? '<table class="spec-table" style="margin-top:30px"><tbody>' +
            p.cmf.materials.map(function (m) {
              return '<tr><th>' + m.k + '</th><td>' + m.v + '</td></tr>';
            }).join('') + '</tbody></table>' : '') +
        '</div>' +
      '</div></div></section>');
  }

  /* 8. 规格参数 */
  if (p.specs) {
    out.push('<section class="section section--tight"><div class="wrap">' +
      '<h2 class="pd-h3" data-reveal>规格与参数</h2>' +
      '<table class="spec-table" data-reveal style="--d:80ms"><tbody>' +
        p.specs.map(function (s) {
          return '<tr><th>' + s.k + '</th><td>' + s.v + '</td></tr>';
        }).join('') +
      '</tbody></table></div></section>');
  }

  /* 9. 草图方案（生态盆景） */
  if (p.schemes) {
    out.push('<section class="section section--tight"><div class="wrap">' +
      '<h2 class="pd-h3" data-reveal>草图方案</h2>' +
      '<div class="cards">' +
        p.schemes.map(function (s, i) {
          return '<article class="card card--mini" data-reveal style="--d:' + (i * 80) + 'ms">' +
            '<div class="card__body"><h3 class="card__title" style="margin-bottom:6px">' + s.name + '</h3>' +
            '<p class="card__sub">' + s.desc + '</p></div></article>';
        }).join('') +
      '</div></div></section>');
  }

  /* 10. 适用场景 */
  if (p.scenes) {
    out.push('<section class="section section--tight"><div class="wrap">' +
      '<h2 class="pd-h3" data-reveal>适用场景</h2>' +
      '<div class="cards">' +
        p.scenes.map(function (s, i) {
          return '<article class="card card--mini" data-reveal style="--d:' + (i * 60) + 'ms">' +
            '<div class="card__body"><h3 class="card__title" style="margin-bottom:4px">' + s.name + '</h3>' +
            '<p class="card__sub">' + s.desc + '</p></div></article>';
        }).join('') +
      '</div></div></section>');
  }

  /* 11. App 界面网格（按摩仪等交互项目） */
  if (p.uiScreens) {
    out.push('<section class="section section--tight"><div class="wrap">' +
      '<h2 class="pd-h3" data-reveal>界面方案</h2>' +
      '<div class="ui-grid">' +
        p.uiScreens.map(function (u, i) {
          return '<figure class="ui-item" data-reveal style="--d:' + (i * 80) + 'ms">' +
            '<img class="zoomable" src="' + rel(u.src) + '"' +
              ' alt="' + esc(u.name) + '" data-full="' + rel(u.full || u.src) + '"' +
              ' data-caption="' + esc(u.name + ' · ' + (u.desc || '')) + '"' +
              ' loading="lazy" decoding="async">' +
            '<figcaption><strong>' + esc(u.name) + '</strong>' +
              (u.desc ? '<span>' + esc(u.desc) + '</span>' : '') + '</figcaption>' +
          '</figure>';
        }).join('') +
      '</div></div></section>');
  }

  /* 12. 其余图片 */
  if (p.figures) {
    for (var i = 1; i < p.figures.length; i++) out.push(figure(p.figures[i], 0));
  }

  q('.pd-sections').innerHTML = out.join('');

  /* ---------- 继续浏览 ---------- */
  var idx = PROJECTS.indexOf(p);
  var next = PROJECTS[(idx + 1) % PROJECTS.length];
  var prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length];
  q('#pdNext').innerHTML = [
    { k: '上一个项目', o: prev },
    { k: '下一个项目', o: next }
  ].map(function (n, i) {
    return '<a class="pd-next__card" href="' + n.o.slug + '.html" data-reveal style="--d:' + (i * 90) + 'ms">' +
      '<p class="pd-next__k">' + n.k + ' · ' + n.o.index + '</p>' +
      '<p class="pd-next__t">' + n.o.title + '</p>' +
      '<p class="pd-next__s">' + n.o.category + ' · ' + n.o.year + '</p>' +
    '</a>';
  }).join('');

  var y = q('#year');
  if (y) y.textContent = new Date().getFullYear();

  /* 内容为动态注入，重新观察一次 [data-reveal] */
  if (typeof window.__reveal === 'function') window.__reveal();
})();
</script>
</body>
</html>
